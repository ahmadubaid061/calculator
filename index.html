<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
                margin: 0;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background-color: hsl(0, 0%, 95%);
            }
            #calculator{
                font-family: Arial, sans-serif;
                background-color: hsl(0, 0%, 15%);
                border-radius: 15px;
                width: 400px;
                min-width: 280px; 
                height: 90vh;
                overflow: hidden;
                box-sizing: border-box;
            }
            #display{
                height: 20%;
                width: 100%;
                padding: 20px;
                font-size: 5rem;
                text-align: left;
                border: none;
                background-color: hsl(0, 9%, 34%);
                color: white;
                overflow-x: auto;
                white-space: nowrap;
                box-sizing: border-box;
            }
            #keys{
                height: 70%;
                display: grid;
                grid-template-columns: repeat(4, 1fr);
            
                padding: 15px;
                padding-left: 25px;
                padding-bottom: 10px;
                box-sizing: border-box;
            }
            button{
                width: 60px;
                height: 50px;
                border-radius: 10px;
                border: none;
                background-color: hsl(0, 0%, 30%);
                color: white;
                font-size: 3rem;
                font-weight: bold;
                cursor: pointer;
            }
            #cancel{
                grid-row-start: 5;
                grid-column-start: 1;
                grid-column-end: 5;
                width: 92%;
                
            }
            button:hover{
                background-color: hsl(0, 0%, 40%);
            }
            button:active{
                background-color: hsl(0, 0%, 50%);
            }
            .operator-btn{
                background-color: hsl(35, 100%, 55%);
            }
            .operator-btn:hover{
                background-color: hsl(35, 100%, 65%);
            }
            .operator-btn:active{
                background-color: hsl(35, 100%, 75%);
            }

    </style>
</head>
<body>

    <div id="calculator">
        <input id="display" readonly>
        <div id="keys">
            <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
            <button onclick="appendToDisplay('7')">7</button>
            <button onclick="appendToDisplay('8')">8</button>
            <button onclick="appendToDisplay('9')">9</button>
            <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
            <button onclick="appendToDisplay('4')">4</button>
            <button onclick="appendToDisplay('5')">5</button>
            <button onclick="appendToDisplay('6')">6</button>
            <button onclick="appendToDisplay('*')" class="operator-btn">*</button>
            <button onclick="appendToDisplay('1')">1</button>
            <button onclick="appendToDisplay('2')">2</button>
            <button onclick="appendToDisplay('3')">3</button>
            <button onclick="appendToDisplay('/')" class="operator-btn">/</button>
            <button onclick="appendToDisplay('0')">0</button>
            <button onclick="appendToDisplay('.')">.</button>
            <button onclick="calculate()">=</button>
            <button onclick="clearDisplay()" class="operator-btn" id="cancel">C</button>
        </div>
    </div>

   <script>
        const display = document.querySelector('#display');

        function appendToDisplay(input) {
            if (display.value.length < 40) { 
                display.value += input;
                adjustFontSize();
            } else {
                display.value = 'Error: Max length 40';
                display.style.fontSize = '1.5rem'; 
            }
        }

        function clearDisplay() {
            display.value = "";
            display.style.fontSize = '5rem'; 
        }

        function calculate() {
            try {
                display.value = eval(display.value);
                adjustFontSize();
            } catch (error) {
                display.value = "Error";
                display.style.fontSize = '1.5rem'; 
            }
        }

        function adjustFontSize() {
            const length = display.value.length;

            if (length <= 7) {
                display.style.fontSize = '5rem';
            } else if (length > 7 && length <= 20) {
                display.style.fontSize = '2rem';
            } else if (length > 20 && length <= 25) {
                display.style.fontSize = '1.5rem';
            } else if (length > 25 && length <=30) {
                display.style.fontSize = '1rem';
            } else {
                display.value = 'Error: Max length 30';
                display.style.fontSize = '1.5rem';
            }
        }
    </script>
</body>
</html>
